  <text x="590" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#333">Ticker</text>
  <text x="590" y="357" text-anchor="middle" font-size="9.5" fill="#666">クリア通知スクロール帯 (画面下部固定) / organisms/Ticker.tsx</text>

