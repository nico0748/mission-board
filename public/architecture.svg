  <rect x="590" y="204" width="324" height="46" fill="#fff3e0" stroke="#ffb869" stroke-width="1" rx="6"/>
  <text x="752" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#333">RequestForm</text>
  <text x="752" y="241" text-anchor="middle" font-size="9.5" fill="#666">ミッション依頼フォーム（一般）</text>

  <!-- AdminPanel -->
