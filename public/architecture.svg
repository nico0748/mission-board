  <rect x="42" y="284" width="180" height="60" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5" rx="7"/>
  <text x="132" y="305" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">useInterval</text>
  <text x="132" y="321" text-anchor="middle" font-size="9.5" fill="#555">ボード自動スライド</text>
  <text x="132" y="335" text-anchor="middle" font-size="9" fill="#999">hooks/useInterval.ts</text>

