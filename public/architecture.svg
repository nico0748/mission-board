  <text x="422" y="282" text-anchor="middle" font-size="12" font-weight="700" fill="#333">AdminPanel</text>
  <text x="422" y="299" text-anchor="middle" font-size="9.5" fill="#666">ミッションCRUD · 依頼管理 ※Admin専用</text>

