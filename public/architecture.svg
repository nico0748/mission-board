  <rect x="266" y="378" width="648" height="84" fill="none" stroke="#d1d5db" stroke-width="1" stroke-dasharray="4 2" rx="6"/>
  <text x="590" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#9ca3af" letter-spacing="0.4">共通コンポーネント（Atomic Design）</text>

