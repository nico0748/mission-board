  <rect x="278" y="404" width="192" height="46" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="5"/>
  <text x="374" y="422" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b7280">atoms/</text>
  <text x="374" y="440" text-anchor="middle" font-size="9" fill="#9ca3af">Pill · Tag · Button</text>

  <!-- molecules/ -->
  <rect x="482" y="404" width="192" height="46" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="5"/>
  <text x="578" y="422" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b7280">molecules/</text>
  <text x="578" y="440" text-anchor="middle" font-size="9" fill="#9ca3af">FilterPill</text>

  <!-- organisms/ -->
  <rect x="686" y="404" width="216" height="46" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="5"/>
  <text x="794" y="422" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6b7280">organisms/</text>
  <text x="794" y="440" text-anchor="middle" font-size="9" fill="#9ca3af">MissionCard · ShowcaseGrid · SettingsDrawer</text>

  <!-- Footer -->
  <text x="480" y="632" text-anchor="middle" font-size="9" fill="#ccc">React 18 + TypeScript + Vite</text>
