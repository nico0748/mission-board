  <rect x="266" y="204" width="312" height="46" fill="#fff3e0" stroke="#ffb869" stroke-width="1" rx="6"/>
  <text x="422" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#333">ShowcasePanel</text>
  <text x="422" y="241" text-anchor="middle" font-size="9.5" fill="#666">生徒作品ショーケース</text>

