<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#60a5fa"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="640" fill="#f9f4eb" rx="10"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#333" letter-spacing="0.3">ミッションボード — コンポーネント・データ構成図</text>

  <!-- ────────── App.tsx OUTER BOX ────────── -->
  <rect x="16" y="44" width="928" height="570" fill="none" stroke="#ffb869" stroke-width="2.5" rx="12"/>
  <rect x="24" y="38" width="296" height="14" fill="#f9f4eb"/>
  <text x="30" y="50" font-size="12" font-weight="700" fill="#e67e22">App.tsx</text>
  <text x="96" y="50" font-size="10.5" fill="#777">— 状態管理 · イベントハンドラ</text>

  <!-- ────────── LEFT: DATA / HOOKS ────────── -->
  <rect x="30" y="60" width="204" height="542" fill="#fff8f0" stroke="#ffb869" stroke-width="1" stroke-dasharray="6 3" rx="8"/>
  <text x="132" y="78" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e67e22" letter-spacing="0.4">データ · フック層</text>

  <!-- useGoogleSheets -->
  <rect x="42" y="88" width="180" height="84" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" rx="7"/>
  <text x="132" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">useGoogleSheets</text>
  <text x="132" y="127" text-anchor="middle" font-size="10" fill="#2563eb">Google Sheets API</text>
  <text x="132" y="143" text-anchor="middle" font-size="9.5" fill="#555">ミッションデータ取得</text>
  <text x="132" y="160" text-anchor="middle" font-size="9" fill="#999">hooks/useGoogleSheets.ts</text>

  <!-- usePersistentState -->
  <rect x="42" y="186" width="180" height="84" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="7"/>
  <text x="132" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">usePersistentState</text>
  <text x="132" y="225" text-anchor="middle" font-size="10" fill="#d97706">localStorage</text>
  <text x="132" y="241" text-anchor="middle" font-size="9.5" fill="#555">設定 · 依頼 · 作品データ保存</text>
  <text x="132" y="258" text-anchor="middle" font-size="9" fill="#999">hooks/usePersistentState.ts</text>

